<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>리온대학교 입학 검사소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700;900&display=swap">
<style>
/* concept: 정문에서 시작하는 비주얼노벨형 입학 검사. 어두운 남색 무대 위에 벚꽃, 하단 대사창, 중앙 서류 패널. 마지막은 흰 종이 합격통지서. */
:root{
  --ink:#0b1022; --ink2:#141c3a; --navy:#12306b; --gold:#e6c883; --sakura:#f2b8c8; --fg:#eef1fa; --sub:#a9b3cf; --line:rgba(255,255,255,.16);
  --paper:#fbfbfe; --pink:#17203f; --pfg:#1d2440; --psub:#5b6482; --pline:#d8dcea; --stamp:#c8352b; --good:#4fb286; --bad:#e2675a;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","Batang","Apple SD Gothic Neo",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:#0b1022}
html,body{min-height:100%}
body{cursor:pointer;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,a,summary,label,select{cursor:pointer}input,textarea{cursor:text}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:relative;min-height:100vh;min-height:100svh}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease;z-index:0;transform:scale(1.04)}
.bg.on{opacity:1}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-1.2%,-1%)}}
#shade{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,12,30,.35) 0%,rgba(8,12,30,.15) 40%,rgba(8,12,30,.7) 100%);pointer-events:none;transition:background .6s}
body[data-mode="panel"] #shade,body[data-mode="title"] #shade{background:rgba(8,12,30,.72)}
#petals{position:fixed;top:0;left:0;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#hud{position:fixed;z-index:6;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:center;gap:6px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#hud span{font-size:11px;letter-spacing:.08em;color:var(--sub);padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:rgba(10,16,40,.55);white-space:nowrap}
#hud span.on{color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:700}
#hud span.done{color:var(--gold);border-color:rgba(230,200,131,.5)}
#sp{position:fixed;z-index:3;bottom:-6px;left:max(0px,calc(50% - 720px));height:min(calc(100vh - 56px),1020px);height:min(calc(100svh - 56px),1020px);opacity:0;transform:translateY(26px);transition:opacity .5s,transform .6s;pointer-events:none;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
#sp.show{opacity:1;transform:none}
#sp img{height:100%;width:auto;display:block}
@keyframes breathe{50%{transform:scale(1.015) translateY(-3px)}}
#dlg{position:fixed;z-index:7;left:0;right:0;bottom:0;padding:0 max(16px,3vw) calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
#dlg .box{pointer-events:auto;max-width:980px;margin:0 auto;min-height:150px;background:rgba(9,14,36,.94);border:1px solid rgba(230,200,131,.4);border-radius:14px;padding:26px 24px 18px;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#dn{position:absolute;left:18px;top:-15px;background:var(--navy);color:var(--gold);border:1px solid rgba(230,200,131,.55);padding:3px 16px;border-radius:20px;font-weight:700;font-size:14px;letter-spacing:.04em}
#dt{font-size:17px;line-height:1.75;min-height:84px;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
#caret{position:absolute;right:20px;bottom:12px;color:var(--gold);animation:blink 1s infinite;opacity:0}
@keyframes blink{50%{transform:translateY(4px)}}
#choices[hidden],#dlg[hidden]{display:none!important}
#choices{position:fixed;z-index:8;left:0;right:0;bottom:calc(var(--dlgh,168px) + 26px);padding:0 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
#choices .tm{width:min(560px,100%);height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
#choices .tm i{display:block;height:100%;background:var(--gold);transform-origin:left}
.ch{width:min(560px,100%);text-align:left;padding:13px 18px;border-radius:12px;border:1px solid rgba(230,200,131,.5);background:rgba(10,16,40,.92);font-size:15.5px;transition:transform .15s,background .15s;animation:rise .35s both}
@media(hover:hover){.ch:hover{background:var(--navy)}}
#ui{position:relative;z-index:4;display:none;padding:64px 16px 48px;min-height:100vh;min-height:100svh}
body[data-mode="panel"] #ui,body[data-mode="title"] #ui{display:flex;flex-direction:column;align-items:center;justify-content:center}
.panel{width:min(640px,100%);animation:rise .55s ease both}
.center{text-align:center}
.kick{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.panel h2{font-family:var(--serif);font-size:28px;margin:0 0 10px;font-weight:700;text-wrap:balance}
.sub{color:var(--sub)}
/* title */
.ttl img{width:92px;margin-bottom:10px;opacity:.95}
.ttl h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,10vw,68px);letter-spacing:-.02em;margin:0;line-height:1.1;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.ttl .en{letter-spacing:.42em;font-size:12px;color:var(--gold);margin:10px 0 22px}
.ttl p{margin:0 auto 26px;max-width:420px;color:var(--sub)}
.btn{background:var(--gold);color:#1a1a2e;border:0;padding:14px 34px;border-radius:40px;font-weight:700;font-size:16px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 24px rgba(230,200,131,.25)}
@media(hover:hover){.btn:hover{box-shadow:0 12px 30px rgba(230,200,131,.4);filter:brightness(1.06)}}
.btn.gh{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* form paper */
.paper{background:var(--paper);color:var(--pfg);border-radius:6px;padding:28px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--pfg);padding-bottom:10px;margin-bottom:18px;gap:10px}
.paper .hd b{font-family:var(--serif);font-size:21px}
.paper .hd small{color:var(--psub);font-size:12px;white-space:nowrap}
.fld{display:block;margin-bottom:16px;opacity:0;animation:rise .5s ease forwards}
.fld>span{display:block;font-size:12px;font-weight:600;color:var(--psub);margin-bottom:4px;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--pline);padding:7px 2px;color:var(--pfg);font-size:16px;border-radius:0;transition:border-color .2s;min-width:0}
.fld textarea{resize:none;height:62px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--navy);box-shadow:0 2px 0 var(--navy)}
.fld select option{color:#111}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--pline);background:#fff;color:var(--pfg);padding:5px 13px;border-radius:20px;font-size:13.5px;transition:all .15s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);transform:scale(1.05)}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:24px;color:var(--pline);padding:0 2px;transition:transform .12s,color .12s;line-height:1}
.stars button.on{color:#e0a82e}

.err{color:var(--stamp);font-size:13px;min-height:20px;margin:4px 0 8px}
.paper .btn{width:100%;background:var(--navy);color:#fff;box-shadow:none}
.note{font-size:12px;color:var(--psub);margin:0 0 14px}
/* games */
.tap{position:relative;width:200px;height:200px;border-radius:50%;border:0;margin:20px auto 12px;display:grid;place-content:center;background:conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(255,255,255,.14) 0);color:#fff;touch-action:manipulation;user-select:none}
.tap::before{content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:50%;background:var(--ink2)}
.tap span,.tap small{position:relative}
.tap span{font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tap small{letter-spacing:.3em;color:var(--gold)}
.tap.pop{animation:pop .12s}
@keyframes pop{50%{transform:scale(.94)}}
.track{position:relative;height:46px;border-radius:23px;background:rgba(255,255,255,.12);margin:26px 0 20px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(79,178,134,.5);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.mk{position:absolute;top:4px;bottom:4px;width:8px;border-radius:4px;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.qcard{background:rgba(14,20,46,.94);border:1px solid var(--line);border-radius:14px;padding:22px 20px;text-align:left}
.qcard h3{margin:0 0 16px;font-size:19px;line-height:1.5;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:all .15s;word-break:keep-all}
.opt:hover{background:rgba(230,200,131,.14);border-color:var(--gold)}
.opt.ok{background:rgba(79,178,134,.3);border-color:var(--good)}
.opt.no{background:rgba(226,103,90,.28);border-color:var(--bad)}
.pbar{height:4px;background:rgba(255,255,255,.14);border-radius:2px;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .4s}
.gr-list{text-align:left;margin:22px 0 0;display:grid;gap:10px}
.gr-list div{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:14px}
.gr-list i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.gr-list i u{display:block;height:100%;width:0;background:var(--gold);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
/* result */
#res{position:relative;z-index:4;display:none;padding:56px 16px 56px;justify-content:center}
body[data-mode="result"] #res{display:flex}
body[data-mode="result"] #shade{background:rgba(8,12,30,.8)}
.cert{width:min(680px,100%);display:flex;flex-direction:column;gap:18px;align-items:center}
.sheet{width:100%;background:var(--paper);color:var(--pfg);border-radius:4px;padding:34px 30px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;animation:unroll .9s ease both;border-top:8px solid var(--navy)}
@keyframes unroll{from{opacity:0;transform:translateY(40px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.sheet .top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--pline);padding-bottom:14px}
.sheet .logo{width:46px;height:34px;background:var(--navy);-webkit-mask:var(--bolt) center/contain no-repeat;mask:var(--bolt) center/contain no-repeat}
.sheet .top b{font-family:var(--serif);font-size:20px;display:block;line-height:1.2}
.sheet .top small{color:var(--psub);letter-spacing:.2em;font-size:10px}
.sheet h2{font-family:var(--serif);font-weight:900;font-size:34px;text-align:center;margin:22px 0 4px;letter-spacing:.3em;text-indent:.3em}
.ids{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--psub);font-size:12.5px;margin-bottom:20px}
.ids b{color:var(--pfg);font-variant-numeric:tabular-nums}
.sheet .body{line-height:1.9;font-size:15px;word-break:keep-all}
.sheet .body strong{font-family:var(--serif);font-size:20px;border-bottom:2px solid var(--gold)}
.gbox{display:grid;grid-template-columns:128px minmax(0,1fr);gap:20px;margin:22px 0;align-items:center}
.gcirc{height:128px;aspect-ratio:1;border:4px double var(--navy);border-radius:50%;display:grid;place-content:center;text-align:center;position:relative}
.gcirc b{font-family:var(--serif);font-size:62px;line-height:1;color:var(--navy)}
.gcirc small{font-size:10px;letter-spacing:.2em;color:var(--psub)}
.gbox h3{margin:0;font-size:20px;font-family:var(--serif)}
.gbox p{margin:4px 0 0;color:var(--psub);font-size:13.5px}
.bars{display:grid;gap:9px;margin:4px 0 18px}
.bars div{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.bars i{display:block;height:9px;background:#e7eaf4;border-radius:5px;overflow:hidden}
.bars u{display:block;height:100%;width:0;background:var(--navy);border-radius:5px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.cm{border-left:4px solid var(--gold);background:#f1f3fa;padding:12px 16px;font-size:14.5px;border-radius:0 6px 6px 0}
.cm small{display:block;color:var(--psub);margin-top:4px}
.sheet .date{text-align:right;margin-top:24px;color:var(--psub);font-size:13px}
.sheet .sign{text-align:right;font-family:var(--serif);font-weight:700;font-size:17px;margin-top:4px;padding-right:86px;position:relative}
.stamp{position:absolute;right:6px;top:-26px;width:74px;height:74px;border:3px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-content:center;font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.1;text-align:center;transform:rotate(-14deg);opacity:0;animation:stamp .45s 1.5s cubic-bezier(.3,1.6,.5,1) forwards;mix-blend-mode:multiply}
@keyframes stamp{from{opacity:0;transform:rotate(-30deg) scale(2.4)}to{opacity:.88;transform:rotate(-14deg) scale(1)}}
.pass{position:absolute;right:26px;top:96px;width:92px;height:92px;border:4px solid var(--stamp);color:var(--stamp);border-radius:8px;display:grid;place-content:center;font-family:var(--serif);font-weight:900;font-size:32px;transform:rotate(12deg);opacity:0;animation:pass .5s 1.1s cubic-bezier(.3,1.6,.5,1) forwards;mix-blend-mode:multiply}
@keyframes pass{from{opacity:0;transform:rotate(30deg) scale(2.6)}to{opacity:.85;transform:rotate(12deg) scale(1)}}
.acts{width:100%;display:grid;gap:10px}
.acts .btn{width:100%;text-align:center;text-decoration:none;display:block}
.acts .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp{width:100%;color:var(--sub);font-size:13px}
.cp summary{cursor:pointer;padding:6px 0}
.cp textarea{width:100%;height:230px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:10px;font-size:13px;line-height:1.6;resize:vertical}
.hint{font-size:13px;color:var(--sub);text-align:center;margin:0}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:#fff;color:#111;padding:10px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){
 #sp{left:50%;bottom:150px;height:min(124vw,calc(100svh - 205px));transform:translate(-50%,26px)}#sp.show{transform:translate(-50%,0)}
 #dt{font-size:15.5px;min-height:96px}#dlg .box{padding:24px 16px 20px;min-height:168px}
 .two{grid-template-columns:1fr}.paper{padding:22px 18px}
 .gbox{grid-template-columns:96px minmax(0,1fr);gap:14px}.gcirc{height:96px}.gcirc b{font-size:46px}
 .sheet{padding:26px 18px 24px}.sheet h2{font-size:26px}.pass{right:12px;top:92px;width:70px;height:70px;font-size:24px}
 .paper .hd b{font-size:18px}.paper .hd small{display:none}
 #hud span{font-size:10px;padding:2px 7px}.acts .row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let P={name:'',age:0,skill:'',hobby:'',traits:[],why:'',intro:'',selfP:3,selfK:3};
let R={},retries=0,SID='',EXAMNO='';
function mode(m){document.body.dataset.mode=m;$('#dlg').hidden=m!=='talk';$('#sp').classList.toggle('show',m==='talk');}
let curBg=null,flip=false;
function bg(k){if(curBg===k)return;curBg=k;flip=!flip;const on=flip?$('#bgA'):$('#bgB'),off=flip?$('#bgB'):$('#bgA');on.style.backgroundImage=`url(${IM[k]})`;on.classList.add('on');off.classList.remove('on')}
function hud(i){const s=[...document.querySelectorAll('#hud span')];$('#hud').classList.toggle('on',i>=0);s.forEach((e,k)=>{e.className=k<i?'done':k===i?'on':''})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---- dialogue ---- */
let adv=null,typing=null,hook=null;
function say(w,text){return new Promise(res=>{
  $('#choices').hidden=true;mode('talk');
    const t=String(text).replace(/\{name\}/g,P.name||'신입생');
  const dn=$('#dn'),el=$('#dt'),ca=$('#caret');
  dn.textContent=w==='나'?(P.name||'나'):w;dn.hidden=!w||w==='해설';
  el.innerHTML='<span></span><span style="visibility:hidden"></span>';const a=el.firstChild,b=el.lastChild;const setT=i=>{a.textContent=t.slice(0,i);b.textContent=t.slice(i)};setT(0);fit();ca.style.opacity=0;clearInterval(typing);typing=null;
  const fin=()=>{clearInterval(typing);typing=null;setT(t.length);ca.style.opacity=1};
  if(RM){fin()}else{let i=0;typing=setInterval(()=>{i++;setT(i);if(i>=t.length){clearInterval(typing);typing=null;ca.style.opacity=1}},24)}
  adv=()=>{if(typing){fin();return}adv=null;res()};
})}
function fit(){try{const b=$('#dlg .box');if(b&&!$('#dlg').hidden)document.documentElement.style.setProperty('--dlgh',b.offsetHeight+'px')}catch(_){}}
addEventListener('resize',fit);

function tapGame(){return new Promise(res=>{
  panel(`<div class="kick">신체검사 1/2</div><h2>체력 테스트</h2><p class="sub">첫 탭부터 6초 동안 버튼을 최대한 빠르게 누르세요. 키보드는 스페이스바예요.</p>
  <button class="tap" id="tapb" style="--p:0" aria-label="탭"><span id="tapn">0</span><small>TAP</small></button><div class="sub" id="tapt">탭하면 시작해요</div>`,'center');
  let n=0,t0=0,iv,over=false;const b=$('#tapb');
  const hit=()=>{if(over)return;if(!t0){t0=performance.now();iv=setInterval(tick,40)}n++;$('#tapn').textContent=n;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')};
  const tick=()=>{const e=performance.now()-t0;b.style.setProperty('--p',Math.min(1,e/6000));$('#tapt').textContent=Math.max(0,6-e/1000).toFixed(1)+'초';if(e>=6000){over=true;clearInterval(iv);hook=null;b.disabled=true;$('#tapt').textContent='종료, '+n+'회';setTimeout(()=>res(n),1000)}};
  b.addEventListener('pointerdown',e=>{e.preventDefault();hit()});b.addEventListener('keydown',e=>{if(e.code==='Enter')e.preventDefault()});hook=hit;
})}
function timingGame(){return new Promise(async res=>{
  const sp=[.8,1.05,1.3];let sc=[];
  for(let r=0;r<3;r++){
    const zl=.12+Math.random()*.6,zw=.16,zc=zl+zw/2;
    panel(`<div class="kick">신체검사 2/2 · ${r+1}/3</div><h2>순발력 테스트</h2><p class="sub">움직이는 막대가 초록 구간 안에 있을 때 멈추세요. 스페이스바도 돼요.</p>
    <div class="track"><div class="zone" style="left:${zl*100}%;width:${zw*100}%"></div><div class="mk" id="mk"></div></div><button class="btn" id="stop">STOP</button><div class="sub" id="tr" style="margin-top:12px;min-height:24px"></div>`,'center');
    const mk=$('#mk');let t0=performance.now(),pos=0,raf,stopped=false;
    const f=()=>{const t=((performance.now()-t0)/1000*sp[r])%2;pos=t<1?t:2-t;mk.style.left=`calc(${pos*100}% - ${pos*8}px)`;if(!stopped)raf=requestAnimationFrame(f)};f();
    const s=await new Promise(rs=>{const stop=()=>{if(stopped)return;stopped=true;cancelAnimationFrame(raf);hook=null;const d=Math.abs(pos-zc);rs(d<=zw/2?100-d/(zw/2)*25:Math.max(0,75-(d-zw/2)/.3*75))};$('#stop').onclick=stop;$('#stop').onpointerdown=e=>{e.preventDefault();stop()};hook=stop});
    sc.push(s);$('#tr').textContent=s>=75?'명중! '+Math.round(s)+'점':s>=40?'아쉬워요. '+Math.round(s)+'점':'빗나갔어요. '+Math.round(s)+'점';await sleep(1000);
  }
  res(sc.reduce((a,b)=>a+b,0)/3);
})}

  await say('양가희','이번에는 상황 판단입니다. 실제 상황이라고 생각하고 평소 행동에 가까운 답을 고르십시오.');
  const sq=shuffle(SIT).slice(0,5);let s=0;
  for(let i=0;i<sq.length;i++){
    const q=sq[i],ord=shuffle([0,1,2]);
    panel(`<div class="pbar"><i style="width:${i/5*100}%"></i></div><div class="kick">상황 판단 ${i+1}/5</div><div class="qcard"><h3>${esc(q[0])}</h3>${ord.map(k=>`<button class="opt" data-k="${k}">${esc(q[1][k])}</button>`).join('')}</div>`);
    const k=await new Promise(r=>document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>r(+b.dataset.k)));
    s+=q[2][k];document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.toggle('ok',+b.dataset.k===k)});await sleep(500);
  }
  R.sense=s/10*100;
}
/* ---- interview ---- */
const IV=[
['…심박수가 높군요. 긴장했습니까?',['네, 솔직히 많이 떨립니다.','아뇨, 전혀요.','저요? 아니, 떨리는데요?'],[2,1,0]],
['수치는 거짓말을 하지 않습니다. 결과가 낮게 나오면 어떻게 하겠습니까?',['재검 전까지 꾸준히 운동하고 준비합니다.','일단 결과부터 보고 생각하겠습니다.','한 번만 봐주시면 안 될까요?'],[2,1,0]],
['뇌물과 청탁은 접수하지 않습니다. 다만 커피는 괜찮습니다.',['정중히 사양합니다.','저는 괜찮으니 조교님께 드리겠습니다.','감사히 마시겠습니다.'],[2,1,0]]];
async function interview(){
  hud(4);bg('LAB');
  await say('양가희','마지막은 면접입니다. 질문마다 제한 시간은 8초이며, 시간이 지나면 무응답으로 기록합니다.');
  let s=0,to=0;
  for(const q of IV){
    await say('양가희',q[0]);
    const opts=shuffle([0,1,2]);
    const k=await choose(opts.map(i=>q[1][i]),8);
    if(k<0){to++;await say('양가희','시간 초과. 무응답으로 기록합니다.');continue}
    s+=q[2][opts[k]];
  }
  R.mind=Math.max(0,s/6*100-to*5);
}
/* ---- grading ---- */
const GN={S:'촉망받는 우등생',A:'제법 괜찮은 학생',B:'평범한 학생',C:'불쌍한 사람',D:'폐급'};
const CM={S:'수치가 예외적으로 우수합니다. 다만 기대치도 함께 올라갑니다.',A:'제법 양호합니다. 방심은 감점 요인입니다.',B:'평균입니다. 평균은 나쁜 수치가 아닙니다.',C:'개선 여지가 큽니다. 재검사 서류는 행정실 3번 창구에서 받으십시오.',D:'…수치는 거짓말을 하지 않습니다. 학생상담센터 연락처를 드리겠습니다.'};
function grade(){
  const d=(self,act)=>self>act?self-act:(act-self)*.4;
  const dev=(d(P.selfP*20,R.phys)+d(P.selfK*20,R.know))/2;
  R.honest=Math.max(10,Math.min(100,100-dev*.9));
  const S={phys:R.phys,know:R.know,sense:R.sense,mind:R.mind,honest:R.honest};
  for(const k in S)R[k]=Math.round(S[k]);
  const total=R.phys*.2+R.know*.25+R.sense*.25+R.mind*.15+R.honest*.15;R.total=Math.round(total);
  R.g=total>=88?'S':total>=75?'A':total>=60?'B':total>=45?'C':'D';
  const m={phys:'체력',know:'이론',sense:'센스',mind:'멘탈'};
  const ks=Object.keys(m).sort((a,b)=>R[b]-R[a]);R.type=m[ks[0]];R.weak=m[ks[3]];
  R.cm=CM[R.g]+(R.honest<55?' 자가평가와 실측 사이의 차이는 감점 처리했습니다.':'');
}
async function grading(){
  bg('B_BOARD');
  await say('양가희','검사를 종료합니다. 수치를 확인하겠습니다.');
  grade();
  panel(`<div class="kick">채점 중</div><h2>${esc(P.name)}님의 검사 결과를 집계하고 있어요</h2><div class="gr-list">${[['체력','phys'],['이론','know'],['센스','sense'],['멘탈','mind'],['정직도','honest']].map(r=>`<div><span>${r[0]}</span><i><u data-v="${R[r[1]]}"></u></i><b>${R[r[1]]}</b></div>`).join('')}</div>`,'center');
  await sleep(100);document.querySelectorAll('.gr-list u').forEach(u=>u.style.width=u.dataset.v+'%');
  await sleep(RM?300:2200);
}
/* ---- result ---- */
function copyText(){return [`[입학 검사 결과 | 리온대학교 X스학과]`,`이름: ${P.name}`,`나이: ${P.age}세`,`특기: ${P.skill||'없음'}`,`취미: ${P.hobby||'없음'}`,`성격: ${P.traits.join(', ')||'없음'}`,`지원동기: ${P.why}`,`자기소개: ${P.intro||'없음'}`,`학번: ${SID}`,`등급: ${R.g} (${GN[R.g]})`,`능력치: 체력 ${R.phys} / 이론 ${R.know} / 센스 ${R.sense} / 멘탈 ${R.mind} / 정직도 ${R.honest}`,`유형: ${R.type}형 (약점: ${R.weak})`,`담당관 코멘트: "${R.cm}"`].join('\n')}
async function copyNow(){const t=copyText();
  try{await navigator.clipboard.writeText(t);toast('복사했어요. 크랙 채팅창에 붙여넣어 주세요.');return}catch(e){}
  const ta=$('#cptxt');const d=$('#cpd');d.open=true;ta.focus();ta.select();
  try{if(document.execCommand('copy')){toast('복사했어요. 크랙 채팅창에 붙여넣어 주세요.');return}}catch(e){}
  toast('아래 상자에서 직접 복사해 주세요.')}
function showResult(){
  hud(-1);mode('result');bg('B_BOARD');
  if(!SID){SID='2026-'+String(Math.floor(Math.random()*90000)+10000);EXAMNO='X-'+String(Math.floor(Math.random()*9000)+1000)}
  const dt=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  const left=RETEST_MAX-retries;
  $('#res').innerHTML=`<div class="cert"><div class="sheet"><div class="top"><div><b>리온대학교</b><small>RION UNIVERSITY</small></div></div>
   <h2>합격 통지서</h2><div class="ids"><span>수험번호 <b>${EXAMNO}</b></span><span>학번 <b>${SID}</b></span><span>모집단위 <b>X스학과</b></span></div><div class="pass">합격</div>
   <div class="body"><p><strong>${esc(P.name)}</strong> (${P.age}세) 님은 2026학년도 X스학과 신입생 신체 X스 적격도 검사 결과 아래와 같이 합격하였으므로 이를 통지합니다.</p></div>
   <div class="gbox"><div class="gcirc"><b>${R.g}</b><small>GRADE</small></div><div><h3>${GN[R.g]}</h3><p>${R.type}형 · 약점 ${R.weak}<br>종합 ${R.total}점 / 100</p></div></div>
   <div class="bars">${[['체력','phys'],['이론','know'],['센스','sense'],['멘탈','mind'],['정직도','honest']].map(r=>`<div><span>${r[0]}</span><i><u data-v="${R[r[1]]}"></u></i><b>${R[r[1]]}</b></div>`).join('')}</div>
   <div class="cm">“${esc(R.cm)}”<small>검사 담당관 양가희 · 보건소장</small></div>
   <div class="date">${dt}</div><div class="sign">리온대학교 총장 남궁현<div class="stamp">직인</div></div></div>
   <div class="acts"><button class="btn" id="b-copy">인적사항 복사하기</button>
    <div class="row"><a class="btn gh" id="b-back" href="${CHAT_URL||'#'}" target="_blank" rel="noopener">채팅으로 돌아가기</a><button class="btn gh" id="b-re" ${left<=0?'disabled':''}>재검사 신청 (${Math.max(0,left)}회 남음)</button></div>
    <p class="hint">복사한 내용을 크랙 첫 대화창에 붙여넣으면 ${esc(P.name)}님의 입학 정보와 등급이 반영돼요.</p>
    <details class="cp" id="cpd"><summary>복사될 내용 미리보기</summary><textarea id="cptxt" readonly>${esc(copyText())}</textarea></details></div></div>`;
  window.scrollTo(0,0);
  setTimeout(()=>document.querySelectorAll('.bars u').forEach(u=>u.style.width=u.dataset.v+'%'),400);
  $('#b-copy').onclick=copyNow;
  $('#b-back').onclick=e=>{if(!CHAT_URL){e.preventDefault();toast('채팅 링크가 아직 연결되지 않았어요.')}};
  $('#b-re').onclick=async()=>{if(retries>=RETEST_MAX)return;retries++;$('#res').innerHTML='';await session(true)};
}
async function session(retest){
  if(retest){await say('양가희','재검사 신청이 승인되었습니다. 학과장 결재까지 완료되었으니 같은 순서로 다시 진행하겠습니다.')}
  R={};
  await bodyTest();await theory();await situation();await interview();await grading();showResult();
}
(async function main(){
  await title();await intro();await formScene();
  await say('양가희','접수 완료. {name} 학생, 기재 내용을 확인했습니다. 첫 검사는 신체검사입니다.');
  await session(false);
})();
</script>
</body></html>
