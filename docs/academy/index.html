<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>에테르나 입학 소환청</title>
<meta name="theme-color" content="#efe9f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090d1f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Jua&family=Noto+Sans+KR:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Brush+Script&display=swap">
<script>try{var t=localStorage.getItem("eterna-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Layout: 섬 위에 떠 있는 단일 무대. 상단 진행 표지, 장면(등록 → 학생증 → 제단 → 소환 의식 → 결과)이 차례로 교체된다. 다크(밤) · 라이트(새벽) 지원. */
:root{
  --night:#090d1f; --night-2:#111834; --deep:#182248;
  --panel:rgba(17,24,52,.78); --line:rgba(217,178,95,.28); --line-soft:rgba(160,172,230,.16);
  --gold:#d9b25f; --gold-hi:#f4dfa6; --parch:#efe7d2; --muted:#a3abcc; --dim:#6f789e;
  --mana:#8fa2ff; --danger:#ff8f8f;
  --t-fire:#ff8a4c; --t-water:#4cc3ff; --t-wind:#7fe0b4; --t-earth:#d4a15a; --t-light:#ffe28a; --t-dark:#b48cff; --t-none:#d6d6e6;
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-sign:"Nanum Brush Script",cursive;
  --field:rgba(8,12,30,.6); --field-2:rgba(8,12,30,.4); --on-gold:#1d1630; --shade:rgba(5,7,18,.8); --node:#0d132d; --chipbg:rgba(9,13,31,.75);
  --card-sh:0 30px 60px -30px rgba(0,0,0,.9);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --night:#efe9f1; --night-2:#fbf8f4; --deep:#e2dcef;
  --panel:rgba(255,255,255,.74); --line:rgba(176,132,48,.38); --line-soft:rgba(70,72,140,.16);
  --gold:#b78630; --gold-hi:#8f6219; --parch:#1f2650; --muted:#525888; --dim:#7a7fa6;
  --mana:#6f80e8; --danger:#c8434f;
  --t-fire:#e8692c; --t-water:#1e9bd8; --t-wind:#2fae7c; --t-earth:#b07a2e; --t-light:#d6a51c; --t-dark:#8a5ae0; --t-none:#8a8aa6;
  --field:rgba(255,255,255,.8); --field-2:rgba(255,255,255,.55); --shade:rgba(40,36,80,.45); --node:#fbf8f4; --chipbg:rgba(255,255,255,.85);
  --card-sh:0 30px 50px -30px rgba(60,50,120,.45);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --night:#efe9f1; --night-2:#fbf8f4; --deep:#e2dcef;
  --panel:rgba(255,255,255,.74); --line:rgba(176,132,48,.38); --line-soft:rgba(70,72,140,.16);
  --gold:#b78630; --gold-hi:#8f6219; --parch:#1f2650; --muted:#525888; --dim:#7a7fa6;
  --mana:#6f80e8; --danger:#c8434f;
  --t-fire:#e8692c; --t-water:#1e9bd8; --t-wind:#2fae7c; --t-earth:#b07a2e; --t-light:#d6a51c; --t-dark:#8a5ae0; --t-none:#8a8aa6;
  --field:rgba(255,255,255,.8); --field-2:rgba(255,255,255,.55); --shade:rgba(40,36,80,.45); --node:#fbf8f4; --chipbg:rgba(255,255,255,.85);
  --card-sh:0 30px 50px -30px rgba(60,50,120,.45);
  color-scheme:light;
}
/* 학생증은 어느 테마에서든 밤색 카드 */
.idcard{--parch:#efe7d2;--gold:#d9b25f;--gold-hi:#f4dfa6;--dim:#7f88ad;--muted:#a3abcc}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:var(--f-body);font-weight:500;font-size:16.5px;line-height:1.7;font-synthesis-weight:none;transition:background .5s,color .5s;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:calc(84px + env(safe-area-inset-top,0px)) 120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding-block:6px 16px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:54px;width:auto;margin-block:-8px;filter:drop-shadow(0 0 10px rgba(143,162,255,.3))}
.brand small{font-family:var(--f-latin);letter-spacing:.22em;font-size:11px;color:var(--gold)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-family:var(--f-display);font-size:15px;color:var(--dim);padding:5px 12px;border:1px solid var(--line-soft);border-radius:999px;display:flex;gap:7px;align-items:center;transition:.4s}
.steps li b{font-family:var(--f-latin);font-weight:800;font-size:12px}
.steps li.on{color:var(--on-gold);box-shadow:0 6px 18px -6px var(--gold);background:var(--gold);border-color:var(--gold)}
.steps li.done{color:var(--gold-hi);border-color:var(--line)}
.sound{background:none;border:1px solid var(--line-soft);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.sound[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--line)}

.scene{animation:sceneIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sceneIn{from{opacity:.0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:42px 10px}
.hero-logo{width:min(560px,100%);filter:drop-shadow(0 0 30px rgba(143,162,255,.25));animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.eyebrow{font-family:var(--f-latin);font-weight:800;letter-spacing:.26em;font-size:13px;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,52px);line-height:1.25;margin:.4em 0 .5em;text-wrap:balance}
.hero p{color:var(--muted);max-width:34em;margin:0 0 1.4em}
.letter{position:relative;background:linear-gradient(160deg,#f3ead2,#e2d4b0);color:#2a2238;border-radius:4px;padding:28px 28px 22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(217,178,95,.5) inset;transform:rotate(1.6deg);font-size:14.5px}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(120,90,40,.35);pointer-events:none}
.letter h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0 0 10px;color:#3a2a55}
.letter p{color:#43384f;margin:.4em 0}
.letter .seal{position:absolute;right:20px;bottom:-22px;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d14b5a,#7e1e2e 70%);display:grid;place-items:center;color:#f4dfa6;font-family:var(--f-latin);font-size:11px;letter-spacing:.08em;box-shadow:0 6px 14px rgba(0,0,0,.4);transform:rotate(-12deg)}
.letter .sig{font-family:var(--f-sign);font-size:26px;color:#3a2a55;margin-top:6px}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff3d1 0%,#f0cf86 45%,#d6a74c 100%);color:#3a2a07;border:0;border-radius:999px;padding:15px 30px;font-family:var(--f-display);font-weight:400;font-size:19px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(217,178,95,.7);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(217,178,95,.9)}
.cta:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ghost{background:var(--panel);border:1px solid var(--line);color:var(--gold-hi);border-radius:999px;padding:13px 22px;cursor:pointer;font-family:var(--f-display);font-size:17px;transition:transform .2s}
.ghost:hover{transform:translateY(-2px)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* registration */
.reg{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:36px;padding-block:30px}
.sheet{background:var(--panel);border:1px solid var(--line-soft);border-radius:20px;padding:30px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--card-sh)}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label.l,span.l{font-family:var(--f-display);font-size:16px;color:var(--gold-hi);letter-spacing:.02em}
label.l em,span.l em{font-style:normal;color:var(--dim);font-size:12px;margin-left:6px}
input[type=text],input[type=number],select,textarea{background:var(--field);border:1px solid var(--line-soft);border-radius:3px;padding:11px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,178,95,.15)}
textarea{resize:vertical;min-height:84px}
.hint{font-size:12.5px;color:var(--dim)}
.err{font-size:12.5px;color:var(--danger);min-height:1em}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px 8px;cursor:pointer;color:var(--muted);transition:.25s}
.seg button+button{border-left:1px solid var(--line-soft)}
.seg button[aria-pressed="true"]{background:rgba(217,178,95,.16);color:var(--gold-hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line-soft);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--muted);transition:.2s}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--on-gold);background:var(--gold)}
.wishes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wish{border:1px solid var(--line-soft);border-radius:8px;background:var(--field-2);padding:9px 6px;cursor:pointer;text-align:center;font-size:13px;color:var(--muted);transition:.2s}
.wish i{display:block;font-style:normal;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--c)}
.wish[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 18px -6px var(--c) inset;color:var(--parch)}
.origin-note{font-size:13px;color:var(--muted);padding:9px 12px;border-left:2px solid var(--gold);background:rgba(217,178,95,.06)}
.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload label{border:1px dashed var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;font-size:13.5px;color:var(--gold-hi)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:14px;min-width:0}
.side .cap{font-family:var(--f-latin);font-size:11px;letter-spacing:.24em;color:var(--gold);text-align:center}

/* ID card */
.card-stage{perspective:1200px;container-type:inline-size}
.idcard{position:relative;aspect-ratio:1.586;width:100%;max-width:430px;margin:0 auto;border-radius:14px;overflow:hidden;color:var(--parch);
  background:radial-gradient(120% 140% at 0% 0%,#24306a 0%,#141c3f 45%,#0d132d 100%);
  box-shadow:0 30px 70px -25px rgba(0,0,0,.85),0 0 0 1px rgba(217,178,95,.55) inset,0 0 0 6px rgba(217,178,95,.08) inset;
  transform-style:preserve-3d;transition:transform .25s ease-out;--mx:50%;--my:50%}
.idcard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(217,178,95,.35);border-radius:9px;pointer-events:none}
.idcard .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.35),transparent 40%),
  linear-gradient(115deg,transparent 30%,rgba(255,120,200,.18) 42%,rgba(120,220,255,.2) 50%,rgba(255,230,140,.18) 58%,transparent 70%);
  background-size:100% 100%,250% 250%;background-position:center,calc(var(--mx) * 1.2) 50%}
.idcard .hdr{position:absolute;left:4.2%;right:4.2%;top:5%;display:flex;justify-content:space-between;align-items:center}
.idcard .hdr .t{font-family:var(--f-latin);font-size:min(10px,2.3cqw);letter-spacing:.22em;color:var(--gold)}
.idcard .hdr .k{font-family:var(--f-display);font-weight:800;font-size:min(13px,3cqw);color:var(--gold-hi)}
.crest{width:min(26px,6cqw);height:min(26px,6cqw)}
.idcard .photo{position:absolute;left:4.2%;top:18%;width:27%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#2a3670,#151d40);border:1px solid rgba(217,178,95,.5);display:grid;place-items:center}
.idcard .photo img{width:100%;height:100%;object-fit:cover}
.idcard .photo span{font-family:var(--f-display);font-weight:800;font-size:min(34px,8cqw);color:rgba(244,223,166,.75)}
.idcard .info{position:absolute;left:36%;right:4%;top:17%;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw 3cqw;font-size:min(12px,2.8cqw);margin:0}
.idcard .info .w{grid-column:1/-1}
.idcard .info dt{font-family:var(--f-latin);font-size:min(8.5px,2cqw);letter-spacing:.18em;color:var(--dim)}
.idcard .info dd{margin:0;font-weight:700;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idcard .info .name{font-family:var(--f-display);font-weight:800;font-size:min(19px,4.4cqw)}
.idcard .info .num{font-family:var(--f-mono);letter-spacing:.06em;color:var(--gold-hi)}
.idcard .foot{position:absolute;left:4.2%;right:4.2%;bottom:4.5%;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.idcard .runes{flex:1;height:min(16px,3.6cqw);display:flex;gap:2px;align-items:flex-end;opacity:.7}
.idcard .runes i{flex:1;background:var(--gold);opacity:.55}
.idcard .sign{font-family:var(--f-sign);font-size:min(20px,4.6cqw);color:var(--gold-hi);line-height:1;text-align:right}
.idcard .sign small{display:block;font-family:var(--f-body);font-size:min(8.5px,2cqw);color:var(--dim)}
.idcard .dormv{color:var(--dim)}
.idcard .dormv.on{color:var(--gold-hi);animation:dormin 1s ease-out}
@keyframes dormin{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 14px var(--gold)}100%{text-shadow:none}}
.idcard .enr{font-size:min(8.5px,2cqw);color:var(--dim);letter-spacing:.06em;margin-bottom:3px}
.idcard .dormOLD{position:absolute;right:16px;top:44px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;color:#1d1630;background:var(--gold);box-shadow:0 0 0 3px rgba(217,178,95,.25);transform:scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.idcard .dorm.on{transform:scale(1)}
.idcard.example{filter:saturate(.7)}
.idcard .exmark{position:absolute;right:16px;bottom:44px;font-size:10px;color:var(--dim);border:1px solid var(--line-soft);padding:1px 6px;border-radius:2px}
.idcard .stamp{position:absolute;right:3%;top:36%;width:min(96px,21cqw);height:min(96px,21cqw);border-radius:50%;border:3px double rgba(209,75,90,.85);color:rgba(209,75,90,.9);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:min(13px,3cqw);line-height:1.3;transform:rotate(-16deg) scale(2.6);opacity:0;pointer-events:none}
.idcard .stamp.hit{animation:stamp .55s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-16deg) scale(2.6)}70%{opacity:1;transform:rotate(-16deg) scale(.92)}100%{opacity:.85;transform:rotate(-16deg) scale(1)}}
.issue .idcard{animation:issue 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes issue{0%{transform:rotateY(-90deg) translateY(30px);opacity:0}60%{transform:rotateY(12deg)}100%{transform:none;opacity:1}}
.sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(244,223,166,.55) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.issue .sweep{animation:sweep 1.6s .9s ease-in-out}
@keyframes sweep{to{transform:translateX(120%)}}

/* issue scene */
.issue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:46px}
.speech{background:var(--panel);border:1px solid var(--line-soft);border-radius:18px;padding:22px 24px;box-shadow:var(--card-sh)}
.speech .who{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--gold-hi);margin-bottom:6px}
.speech .who small{font-family:var(--f-body);font-weight:400;color:var(--dim);margin-left:8px}
.speech p{margin:.3em 0}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}

/* altar */
.altar{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:center;padding-block:24px}
.circle-wrap{position:relative;width:min(620px,100%);aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#circle{width:100%;height:100%;overflow:visible}
.hold{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,rgba(244,223,166,.35),var(--node) 72%);cursor:pointer;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(14px,1.9vw,19px);color:var(--gold-hi);line-height:1.35;box-shadow:0 0 40px -10px rgba(217,178,95,.6);transition:box-shadow .3s}
.hold:active,.hold.on{box-shadow:0 0 70px 0 rgba(217,178,95,.85)}
.hold small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.85) 30%,transparent 70%);opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.mana{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.mana i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mana),var(--gold-hi));box-shadow:0 0 12px var(--gold)}
.typeslist{display:flex;flex-wrap:wrap;gap:6px}
.typeslist span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--c)}

/* result */
.result{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;padding-block:30px;align-items:start}
.beast{position:relative;border-radius:22px;overflow:hidden;background:var(--night-2);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 0 80px -20px var(--tc),var(--card-sh);animation:reveal 1.3s cubic-bezier(.2,.9,.2,1) both}
@keyframes reveal{0%{transform:perspective(1000px) rotateY(80deg) scale(.7);opacity:0;filter:brightness(4)}60%{filter:brightness(1.6)}100%{transform:none;opacity:1;filter:none}}
.beast .pic{position:relative;aspect-ratio:4/3;overflow:hidden}
.beast .pic img{width:100%;height:100%;object-fit:cover;display:block}
.beast .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--night-2) 2%,transparent 45%)}
.beast .badge{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:6px}
.beast .badge span{font-family:var(--f-display);font-size:14px;padding:4px 12px;border-radius:999px;background:var(--chipbg);border:1px solid var(--tc);color:var(--tc)}
.beast .body{padding:0 22px 22px;margin-top:-58px;position:relative;z-index:2}
.beast h2{font-family:var(--f-display);font-weight:400;font-size:46px;margin:0;line-height:1.1;text-shadow:0 0 24px var(--tc)}
.beast .race{color:var(--muted);font-size:14px}
.beast .line{font-family:var(--f-display);font-size:16.5px;margin:14px 0;padding:12px 16px;border-left:2px solid var(--tc);background:rgba(255,255,255,.03)}
.hpcard{display:grid;gap:8px;margin:12px 0}.hpcard .hpl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}.hpcard .hpl b{font-family:var(--f-mono);font-size:18px;color:var(--parch,#f3e9d2);font-variant-numeric:tabular-nums}
.hpcard .hpbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}.hpcard .hpbar i{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 45%,#fff));transform-origin:left;animation:grow 1.2s .4s cubic-bezier(.2,.8,.2,1) both}
.hpcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 28px;font-size:13px;margin:12px 0}
.stat{display:grid;grid-template-columns:2.6em minmax(0,1fr) 3ch;gap:8px;align-items:center}
.stat b{font-weight:400;color:var(--muted)}
.stat s{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.08);text-decoration:none;overflow:hidden}
.stat s i{display:block;height:100%;background:var(--tc);transform-origin:left;animation:grow 1.2s .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.stat span{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.skills{display:grid;gap:8px}
.skill{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px;font-size:15px;background:var(--field-2)}
.skill b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--gold-hi)}
.skill .k{font-family:var(--f-mono);font-size:12.5px;color:var(--gold-hi);white-space:nowrap}
.evo{font-size:13px;color:var(--dim);margin-top:12px}
.evo b{color:var(--parch);font-weight:700}
.copybox{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;color:var(--parch)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#1d1630;padding:10px 18px;border-radius:3px;font-weight:700;transition:.35s;z-index:30}
.toast.on{transform:translate(-50%,0);opacity:1}
.panel-title{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0 0 6px}


/* ===== v2 upgrade ===== */
:root{--sun:#ffb25a;--moon:#8fa2ff;--star:#7fe0b4}
.hero-logo{width:min(520px,100%)}
.intro-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 22px;border-block:1px solid var(--line-soft)}
.intro-facts div{padding:12px 14px;border-left:1px solid var(--line-soft);min-width:0}
.intro-facts div:first-child{border-left:0;padding-left:0}
.intro-facts dt{font-family:var(--f-latin);font-size:10.5px;letter-spacing:.2em;color:var(--gold)}
.intro-facts dd{margin:2px 0 0;font-size:13.5px;color:var(--parch)}
.sec{padding-block:64px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,36px);margin:0;text-wrap:balance}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:38em}
.sec-head .eyebrow{display:block;margin-bottom:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{background:none;border:1px solid var(--line-soft);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s}
.filters button[aria-pressed="true"]{color:var(--on-gold);background:var(--c,var(--gold));border-color:var(--c,var(--gold))}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.mon{position:relative;text-align:left;background:var(--panel);border:1px solid color-mix(in srgb,var(--tc) 35%,transparent);border-radius:18px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.mon:hover,.mon:focus-visible{transform:translateY(-5px);border-color:var(--tc);box-shadow:0 20px 40px -18px var(--tc)}
.mon .im{aspect-ratio:4/3;overflow:hidden;background:var(--night-2);position:relative}
.mon .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.mon:hover .im img{transform:scale(1.07)}
.mon .im::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(9,13,31,.85),transparent 55%)}
.mon .tag{position:absolute;left:10px;top:10px;z-index:2;font-size:11.5px;padding:2px 9px;border-radius:999px;background:rgba(9,13,31,.78);border:1px solid var(--tc);color:var(--tc)}
.mon .tx{padding:11px 14px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mon .tx b{font-family:var(--f-display);font-weight:400;font-size:21px}
.mon .tx span{font-size:12.5px;color:var(--muted)}
.mon[hidden]{display:none}
.dorms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dorm{position:relative;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:18px;padding:20px 20px 18px;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 14%,var(--night-2)),var(--night-2) 70%);overflow:hidden;min-width:0}
.dorm::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%)}
.dorm h3{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--c)}
.dorm .ty{font-family:var(--f-latin);font-size:11px;letter-spacing:.2em;color:var(--muted);margin:2px 0 10px}
.dorm p{margin:0;font-size:14px;color:var(--parch)}
.cal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.cal::before{content:"";position:absolute;left:0;right:0;top:11px;height:1px;background:linear-gradient(90deg,var(--line),var(--line-soft))}
.cal li{position:relative;padding:34px 12px 0 0;min-width:0}
.cal li::before{content:"";position:absolute;left:0;top:5px;width:13px;height:13px;border-radius:50%;background:var(--night);border:2px solid var(--gold)}
.cal li.dark::before{border-color:var(--t-dark);box-shadow:0 0 14px var(--t-dark)}
.cal time{font-family:var(--f-latin);font-size:11px;letter-spacing:.14em;color:var(--gold)}
.cal b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;margin:2px 0 3px}
.cal span{font-size:13px;color:var(--muted)}
.cta-end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:64px 24px}
.cta-end h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:0;text-wrap:balance}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:var(--shade);backdrop-filter:blur(8px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal[hidden]{display:none}
.mbox{position:relative;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:10px;background:var(--night-2);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);box-shadow:0 0 80px -20px var(--tc);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);animation:pop .4s cubic-bezier(.2,.9,.2,1) both}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0}}
.mbox .im{min-height:100%;position:relative}
.mbox .im img{width:100%;height:100%;object-fit:cover;display:block}
.mbox .bd{padding:24px 24px 22px;min-width:0}
.mbox h3{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;text-shadow:0 0 22px var(--tc)}
.mbox .x{position:absolute;right:10px;top:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--chipbg);color:var(--gold-hi);cursor:pointer;font-size:16px}
.statwrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;margin:10px 0}
.statwrap .stats{grid-template-columns:minmax(0,1fr);gap:7px;margin:0}
.radar{width:100%;height:auto;overflow:visible}
.radar .poly{transform-origin:0 0;animation:rad 1.2s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rad{from{transform:scale(.05);opacity:0}}
.beast .pic img{animation:lit 2.2s .5s ease-out both}
@keyframes lit{0%{filter:brightness(0) saturate(0)}45%{filter:brightness(0) saturate(0)}100%{filter:none}}
.dormcard{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:8px;padding:14px 16px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--night-2)),var(--night-2));display:flex;gap:14px;align-items:center}
.dormcard i{font-style:normal;font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--c);width:48px;height:48px;border-radius:50%;border:1px solid var(--c);display:grid;place-items:center;flex:none;box-shadow:0 0 22px -4px var(--c)}
.dormcard b{font-family:var(--f-display);font-weight:400;font-size:20px}
.dormcard span{display:block;font-size:13px;color:var(--muted)}
.dexmap{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px}
.dexmap h4{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.dexmap h4 em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;color:var(--gold-hi)}
.dexmap p{margin:0 0 10px;font-size:12.5px;color:var(--dim)}
.cells{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.cells i{aspect-ratio:1;border-radius:2px;background:rgba(160,172,230,.1)}
.cells i.on{background:var(--tc);box-shadow:0 0 12px var(--tc);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px 2px var(--tc)}}
@media (max-width:900px){
  .dorms{grid-template-columns:minmax(0,1fr)}
  .cal{grid-template-columns:minmax(0,1fr);gap:18px}
  .cal::before{left:6px;right:auto;top:0;bottom:0;width:1px;height:auto}
  .cal li{padding:0 0 0 30px}
  .cal li::before{top:3px}
  .mbox{grid-template-columns:minmax(0,1fr)}
  .mbox .im{aspect-ratio:4/3;min-height:0}
}
@media (max-width:520px){
  .intro-facts{grid-template-columns:minmax(0,1fr)}
  .intro-facts div{border-left:0;padding-left:0;border-top:1px solid var(--line-soft)}
  .intro-facts div:first-child{border-top:0}
  .statwrap{grid-template-columns:minmax(0,1fr)}
  .radar{max-width:200px;margin-inline:auto}
  .dex{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mon .tx b{font-size:16px}
}

@media (max-width:900px){
  .hero,.reg,.issue,.altar,.result{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .letter{transform:none}
}
@media (max-width:520px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .wishes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:minmax(0,1fr);gap:8px}
  label.l em,span.l em{display:block;margin:2px 0 0}
  .hero h1{font-size:clamp(26px,7.4vw,34px)}
  .beast h2{font-size:34px}
  .beast .body{padding:0 16px 18px}
  .copybox{font-size:12px}
  .sheet{padding:20px}
  .steps li span{display:none}
  .brand small{display:none}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px}
  .steps{grid-column:1/-1;grid-row:2;justify-content:center}
  .sound{grid-column:2;grid-row:1}
}

/* ===== 소환 의식: 소환진 → 빛기둥 → 예고(색 승급) → 실루엣 → 공개 ===== */
.rite{position:fixed;inset:0;z-index:85;overflow:hidden;display:grid;place-items:center;--tc:#f4dfa6;--pc:#fff6dc;opacity:0;transition:opacity .5s;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.rite.on{opacity:1}
.rite.out{opacity:0;transition:opacity .7s}
.r-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#1b1840 0,#0a0b1c 55%,#020208 100%)}
.r-rays{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--pc) 55%,transparent) 0 2.2deg,transparent 2.2deg 11deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 52%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 52%);animation:rspin 18s linear infinite;transition:opacity 1s}
@keyframes rspin{to{transform:rotate(360deg)}}
.rite.s2 .r-rays{opacity:.55}
.r-pillar{position:absolute;left:50%;top:-10vh;bottom:-10vh;width:min(44vmin,360px);margin-left:calc(min(44vmin,360px) / -2);transform:scaleX(.015);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.2,1),opacity .4s,filter .6s}
.r-pillar::before,.r-pillar::after,.r-pillar i{content:"";position:absolute;inset:0;border-radius:50%/8%}
.r-pillar::before{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pc) 40%,transparent) 25%,var(--pc) 50%,color-mix(in srgb,var(--pc) 40%,transparent) 75%,transparent);filter:blur(18px);transition:background .6s}
.r-pillar i{left:36%;right:36%;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);filter:blur(4px)}
.r-pillar::after{background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(255,255,255,.35) 22px 24px);-webkit-mask:linear-gradient(90deg,transparent 20%,#000 50%,transparent 80%);mask:linear-gradient(90deg,transparent 20%,#000 50%,transparent 80%);animation:rise .5s linear infinite;opacity:.6}
@keyframes rise{to{background-position:0 -24px}}
.rite.s1 .r-pillar{opacity:1}
.rite.s2 .r-pillar{transform:scaleX(1)}
.rite.s5 .r-pillar{transform:scaleX(2.4);opacity:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity 1.2s}
.r-base{position:absolute;left:50%;bottom:14vh;width:min(70vmin,560px);aspect-ratio:3/1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,color-mix(in srgb,var(--pc) 70%,transparent),transparent 65%);filter:blur(6px);opacity:0;transition:opacity .6s,background .6s}
.rite.s1 .r-base{opacity:.9}
.r-shock{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:3px solid var(--sc,#fff);box-shadow:0 0 30px var(--sc,#fff),inset 0 0 30px var(--sc,#fff);animation:shock 1.1s cubic-bezier(.1,.7,.3,1) forwards;pointer-events:none}
@keyframes shock{from{transform:scale(.2);opacity:1}to{transform:scale(4.2);opacity:0}}
.r-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.r-tease{position:absolute;left:0;right:0;top:16vh;text-align:center;font-family:var(--f-display);color:#fff;pointer-events:none}
.r-tease small{display:block;font-size:clamp(16px,2.4vw,22px);letter-spacing:.06em;color:rgba(255,255,255,.85);text-shadow:0 0 18px var(--pc);opacity:0;transform:translateY(10px);transition:.5s}
.r-tease small.on{opacity:1;transform:none}
.r-glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);font-family:var(--f-display);font-size:min(46vmin,360px);line-height:1;color:var(--tc);opacity:0;text-shadow:0 0 40px var(--tc),0 0 120px var(--tc);pointer-events:none}
.r-glyph.on{animation:glyph 1.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes glyph{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:.95;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5);filter:blur(8px)}}
.r-stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none}
.r-stack .r-go{pointer-events:auto}
.r-sil{position:relative;flex:none;width:min(88vw,640px,calc(50vh * 4 / 3));aspect-ratio:4/3;margin:0;transform:scale(.86);opacity:0;transition:opacity 1.2s,transform 1.6s cubic-bezier(.2,.8,.2,1);isolation:isolate}
.r-sil::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 46% 50% at 50% 50%,var(--pc),transparent 74%);mix-blend-mode:multiply;opacity:.85;transition:opacity 1s}
.rite.s5 .r-sil::before{opacity:0}
.r-sil img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(2.6) brightness(1.7) blur(1.2px);
  -webkit-mask:radial-gradient(ellipse 46% 50% at 50% 50%,#000 58%,transparent 74%);mask:radial-gradient(ellipse 46% 50% at 50% 50%,#000 58%,transparent 74%);transition:filter 1.1s ease-out,-webkit-mask .9s,mask .9s}
.r-sil::after{content:"";position:absolute;inset:6% 12%;border-radius:50%;box-shadow:0 0 60px 10px var(--tc),inset 0 0 60px 6px color-mix(in srgb,var(--tc) 60%,transparent);opacity:.75;animation:breathe 1.6s ease-in-out infinite;transition:opacity .8s}
@keyframes breathe{50%{opacity:.35}}
.rite.s4 .r-sil{opacity:1;transform:scale(1)}
.rite.s4 .r-sil img{animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.rite.s5 .r-sil{opacity:1;transform:none}
.rite.s5 .r-sil img{filter:none;-webkit-mask:radial-gradient(ellipse 70% 72% at 50% 50%,#000 70%,transparent 100%);mask:radial-gradient(ellipse 70% 72% at 50% 50%,#000 70%,transparent 100%);border-radius:24px}
.rite.s5 .r-sil::after{opacity:0}
.r-name{position:relative;text-align:center;color:#fff;opacity:0;transform:translateY(24px);transition:opacity .7s .3s,transform .9s .3s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.r-name small{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:16px;padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid color-mix(in srgb,var(--tc) 70%,transparent);color:var(--tc);backdrop-filter:blur(6px)}
.r-name b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,min(9vw,9vh),84px);line-height:1.1;margin:8px 0 2px;text-shadow:0 0 30px var(--tc),0 4px 0 rgba(0,0,0,.25)}
.r-name span{font-size:16px;color:rgba(255,255,255,.75)}
.rite.s5 .r-name{opacity:1;transform:none}
.r-go{position:relative;transform:translateY(20px);opacity:0;transition:.6s 1.1s;margin-top:6px}
.rite.s5 .r-go{opacity:1;transform:none}
.r-skip{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:3;padding:9px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-family:var(--f-display);font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
.r-skip:hover{background:rgba(255,255,255,.16)}
.rite.s5 .r-skip{display:none}
.r-tap{position:absolute;left:0;right:0;bottom:12vh;text-align:center;color:rgba(255,255,255,.7);font-family:var(--f-display);font-size:15px;opacity:0;transition:.5s;animation:blink 1.4s steps(1) infinite;pointer-events:none}
.rite.s4 .r-tap{opacity:1}
.rite.s5 .r-tap{display:none}
.rite.shake{animation:shk .45s linear}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
.rite .whiteout{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.rite .whiteout.go{animation:wo 1.1s ease-out}

const sfxOn = () => !window.EternaSFX || EternaSFX.on;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; } } if (AC.state === "suspended") AC.resume(); return AC; }

function tone(f, d = .6, type = "sine", v = .08, when = 0) {
  if (!sfxOn() || !ac()) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();

}

/* ---------------- sky canvas ---------------- */
const sky = $("#sky"), cx = sky.getContext("2d");
let W, H, stars = [], motes = [], burst = [], tint = null;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isLight = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "light" : matchMedia("(prefers-color-scheme: light)").matches; };
function size(){ const d = Math.min(devicePixelRatio || 1, 2); W = sky.width = innerWidth * d; H = sky.height = innerHeight * d; sky.style.width = innerWidth + "px"; sky.style.height = innerHeight + "px";
  stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H * .8, r: Math.random() * 1.3 + .2, p: Math.random() * 6 }));

addEventListener("resize", size); size();
function frame(t){
  cx.clearRect(0, 0, W, H);

  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of stars) { cx.globalAlpha = (LT ? .12 : .35) + (LT ? .25 : .45) * Math.sin(t / 900 + s.p) ** 2; cx.fillStyle = LT ? "#ffffff" : "#e8ecff"; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill(); }
  // mist bands
  for (let i = 0; i < 3; i++) { const y = H * (.72 + i * .1) + Math.sin(t / 4000 + i) * 20; const mg = cx.createRadialGradient(W * (.3 + i * .25) + Math.sin(t / 6000 + i) * 80, y, 0, W * (.3 + i * .25), y, W * .5);
    mg.addColorStop(0, LT ? "rgba(255,255,255,.35)" : "rgba(140,155,230,.10)"); mg.addColorStop(1, LT ? "rgba(255,255,255,0)" : "rgba(140,155,230,0)"); cx.globalAlpha = 1; cx.fillStyle = mg; cx.fillRect(0, 0, W, H); }
  for (const m of motes) { if (!reduce) { m.y -= m.v; m.x += Math.sin(t / 2000 + m.p) * .2; if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; } }

  cx.globalAlpha = 1; requestAnimationFrame(frame);
}

function radar(st, col){
  const keys = ["HP","공격","방어","특공","특방","속도"], R = 70, max = 200;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [Math.cos(a) * R * v, Math.sin(a) * R * v]; };
  const ring = k => keys.map((_, i) => pt(i, k).map(n => n.toFixed(1)).join(",")).join(" ");
  const poly = keys.map((k, i) => pt(i, Math.min(st[k] / max, 1)).map(n => n.toFixed(1)).join(",")).join(" ");
  return `<svg class="radar" viewBox="-100 -92 200 184" role="img" aria-label="능력치 분포"><g fill="none" stroke="rgba(160,172,230,.28)" stroke-width=".8">${[.33,.66,1].map(k => `<polygon points="${ring(k)}"/>`).join("")}${keys.map((_, i) => `<line x1="0" y1="0" x2="${pt(i, 1)[0].toFixed(1)}" y2="${pt(i, 1)[1].toFixed(1)}"/>`).join("")}</g>
    <polygon class="poly" points="${poly}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
    ${keys.map((k, i) => { const [x, y] = pt(i, 1.24); return `<text x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" fill="#a3abcc" font-family="Noto Sans KR,sans-serif">${k}</text>`; }).join("")}</svg>`;
}
function bindLore(){

}

function pick(){
  const g = S.p.gender, female = BEASTS.filter(b => b.g === "f"), male = BEASTS.filter(b => b.g === "m");
  const w = BEASTS.map(b => {
    let v = 1;
    if (g === "m") v = b.g === "f" ? 80 / female.length : 20 / male.length;
    else if (g === "f") v = b.g === "m" ? 70 / male.length : 30 / female.length;
    if (S.p.wish && b.t === S.p.wish) v *= 1.5;
    return v; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < BEASTS.length; i++) { r -= w[i]; if (r <= 0) return BEASTS[i]; }
  return BEASTS[BEASTS.length - 1];
}

  const cv = R.querySelector(".r-fx"), c2 = cv.getContext("2d"), DPR = Math.min(devicePixelRatio || 1, 2), P = [];

      <div class="card-stage">${cardHTML(false)}</div>
      <div class="row" style="justify-content:center;margin-top:-4px"><button class="ghost" id="savecard" type="button">🎫 학생증 이미지로 저장</button></div>
      <div class="dormcard" style="--c:${DORM_C[S.dorm]}"><i>${S.dorm}</i><div><b>${S.dorm}의 동 배정</b><span>${b.n}의 ${b.t} 속성 · 이번 달 기숙사 점수 순위는 입학 후 발표됩니다.</span></div></div>
      <div class="dexmap"><h4>도감 <em>1 / 80</em></h4><p>${b.n}(기본체)가 첫 칸을 열었습니다.</p><div class="cells">${Array.from({ length: 80 }, (_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="sheet" style="padding:20px">
        <h3 class="panel-title">채팅 제출용 결과</h3>
        <p class="hint" style="margin:0 0 10px">복사해서 채팅 첫 메시지로 그대로 붙여넣으세요.</p>
        <pre class="copybox" id="cb" tabindex="0">${esc(block())}</pre>
        <div class="row" style="margin-top:12px;justify-content:space-between"><button class="ghost" id="again" type="button">처음부터 다시 등록</button><button class="cta" id="copy" type="button">결과 복사하기</button></div>
      </div>
    </div>
  </section>`;
  tilt($("#idcard"));
  if (!fromSave) setTimeout(() => tone(660, .5, "triangle"), 700);
  $("#copy").onclick = () => { const t = block();
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("#cb")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("텍스트를 선택했어요. 복사해서 붙여넣으세요"); };
    try { navigator.clipboard.writeText(t).then(() => { toast("복사했어요. 채팅에 붙여넣으세요"); SFX("success"); }, sel); } catch(e) { sel(); } };
  $("#savecard").onclick = saveCard;
  $("#again").onclick = () => { S.p = { name:"", age:"", gender:"", origin:"", look:"", traits:[], wish:"", intro:"", photo:"" }; S.id = ""; S.beast = null; S.dorm = ""; tint = null; register(); };
}

hero();
})();
</script>
<script src="../eterna/common/sfx.js"></script>
<script src="../eterna/common/nav.js" data-site="enroll"></script>
<script src="../eterna/common/music-player.js?v=6" defer></script>
</body>
