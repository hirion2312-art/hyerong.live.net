<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>에테르나 입학 소환청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Brush+Script&display=swap">
<style>
/* Layout: 밤의 섬 위에 떠 있는 단일 무대. 상단 진행 표지, 장면(등록 → 학생증 → 제단 → 결과)이 차례로 교체된다. 어두운 단일 테마. */
:root{
  --night:#090d1f; --night-2:#111834; --deep:#182248;
  --panel:rgba(17,24,52,.78); --line:rgba(217,178,95,.28); --line-soft:rgba(160,172,230,.16);
  --gold:#d9b25f; --gold-hi:#f4dfa6; --parch:#efe7d2; --muted:#a3abcc; --dim:#6f789e;
  --mana:#8fa2ff; --danger:#ff8f8f;
  --t-fire:#ff8a4c; --t-water:#4cc3ff; --t-wind:#7fe0b4; --t-earth:#d4a15a; --t-light:#ffe28a; --t-dark:#b48cff; --t-none:#d6d6e6;
  --f-display:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-sign:"Nanum Brush Script",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--parch);font-family:var(--f-body);font-size:16px;line-height:1.65;overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:18px 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:6px 18px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:54px;width:auto;margin-block:-8px;filter:drop-shadow(0 0 10px rgba(143,162,255,.3))}
.brand small{font-family:var(--f-latin);letter-spacing:.22em;font-size:11px;color:var(--gold)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-size:12.5px;color:var(--dim);padding:5px 12px;border:1px solid var(--line-soft);border-radius:999px;display:flex;gap:7px;align-items:center;transition:.4s}
.steps li b{font-family:var(--f-latin);font-weight:700;font-size:11px}
.steps li.on{color:var(--night);background:var(--gold);border-color:var(--gold)}
.steps li.done{color:var(--gold-hi);border-color:var(--line)}
.sound{background:none;border:1px solid var(--line-soft);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
.sound[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--line)}

.scene{animation:sceneIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes sceneIn{from{opacity:.0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:42px 10px}
.hero-logo{width:min(560px,100%);filter:drop-shadow(0 0 30px rgba(143,162,255,.25));animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.eyebrow{font-family:var(--f-latin);letter-spacing:.28em;font-size:12px;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.2vw,46px);line-height:1.25;margin:.4em 0 .5em;text-wrap:balance}
.hero p{color:var(--muted);max-width:34em;margin:0 0 1.4em}
.letter{position:relative;background:linear-gradient(160deg,#f3ead2,#e2d4b0);color:#2a2238;border-radius:4px;padding:28px 28px 22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(217,178,95,.5) inset;transform:rotate(1.6deg);font-size:14.5px}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(120,90,40,.35);pointer-events:none}
.letter h3{font-family:var(--f-display);font-size:19px;margin:0 0 10px;color:#3a2a55}
.letter p{color:#43384f;margin:.4em 0}
.letter .seal{position:absolute;right:20px;bottom:-22px;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d14b5a,#7e1e2e 70%);display:grid;place-items:center;color:#f4dfa6;font-family:var(--f-latin);font-size:11px;letter-spacing:.08em;box-shadow:0 6px 14px rgba(0,0,0,.4);transform:rotate(-12deg)}
.letter .sig{font-family:var(--f-sign);font-size:26px;color:#3a2a55;margin-top:6px}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1d1630;border:0;border-radius:3px;padding:14px 26px;font-family:var(--f-display);font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(217,178,95,.7);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(217,178,95,.9)}
.cta:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ghost{background:none;border:1px solid var(--line);color:var(--gold-hi);border-radius:3px;padding:12px 20px;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* registration */
.reg{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:36px;padding-block:30px}
.sheet{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:28px;backdrop-filter:blur(6px)}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label.l,span.l{font-size:13px;color:var(--gold-hi);letter-spacing:.04em}
label.l em,span.l em{font-style:normal;color:var(--dim);font-size:12px;margin-left:6px}
input[type=text],input[type=number],select,textarea{background:rgba(8,12,30,.6);border:1px solid var(--line-soft);border-radius:3px;padding:11px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,178,95,.15)}
textarea{resize:vertical;min-height:84px}
.hint{font-size:12.5px;color:var(--dim)}
.err{font-size:12.5px;color:var(--danger);min-height:1em}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px 8px;cursor:pointer;color:var(--muted);transition:.25s}
.seg button+button{border-left:1px solid var(--line-soft)}
.seg button[aria-pressed="true"]{background:rgba(217,178,95,.16);color:var(--gold-hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line-soft);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--muted);transition:.2s}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--night);background:var(--gold)}
.wishes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wish{border:1px solid var(--line-soft);border-radius:4px;background:rgba(8,12,30,.4);padding:9px 6px;cursor:pointer;text-align:center;font-size:13px;color:var(--muted);transition:.2s}
.wish i{display:block;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--c)}
.wish[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 18px -6px var(--c) inset;color:var(--parch)}
.origin-note{font-size:13px;color:var(--muted);padding:9px 12px;border-left:2px solid var(--gold);background:rgba(217,178,95,.06)}
.upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload label{border:1px dashed var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;font-size:13.5px;color:var(--gold-hi)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:14px;min-width:0}
.side .cap{font-family:var(--f-latin);font-size:11px;letter-spacing:.24em;color:var(--gold);text-align:center}

/* ID card */
.card-stage{perspective:1200px;container-type:inline-size}
.idcard{position:relative;aspect-ratio:1.586;width:100%;max-width:430px;margin:0 auto;border-radius:14px;overflow:hidden;color:var(--parch);
  background:radial-gradient(120% 140% at 0% 0%,#24306a 0%,#141c3f 45%,#0d132d 100%);
  box-shadow:0 30px 70px -25px rgba(0,0,0,.85),0 0 0 1px rgba(217,178,95,.55) inset,0 0 0 6px rgba(217,178,95,.08) inset;
  transform-style:preserve-3d;transition:transform .25s ease-out;--mx:50%;--my:50%}
.idcard::before{content:"";position:absolute;inset:7px;border:1px solid rgba(217,178,95,.35);border-radius:9px;pointer-events:none}
.idcard .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.55;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.35),transparent 40%),
  linear-gradient(115deg,transparent 30%,rgba(255,120,200,.18) 42%,rgba(120,220,255,.2) 50%,rgba(255,230,140,.18) 58%,transparent 70%);
  background-size:100% 100%,250% 250%;background-position:center,calc(var(--mx) * 1.2) 50%}
.idcard .hdr{position:absolute;left:4.2%;right:4.2%;top:5%;display:flex;justify-content:space-between;align-items:center}
.idcard .hdr .t{font-family:var(--f-latin);font-size:min(10px,2.3cqw);letter-spacing:.22em;color:var(--gold)}
.idcard .hdr .k{font-family:var(--f-display);font-weight:800;font-size:min(13px,3cqw);color:var(--gold-hi)}
.crest{width:min(26px,6cqw);height:min(26px,6cqw)}
.idcard .photo{position:absolute;left:4.2%;top:18%;width:27%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,#2a3670,#151d40);border:1px solid rgba(217,178,95,.5);display:grid;place-items:center}
.idcard .photo img{width:100%;height:100%;object-fit:cover}
.idcard .photo span{font-family:var(--f-display);font-weight:800;font-size:min(34px,8cqw);color:rgba(244,223,166,.75)}
.idcard .info{position:absolute;left:36%;right:4%;top:17%;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw 3cqw;font-size:min(12px,2.8cqw);margin:0}
.idcard .info .w{grid-column:1/-1}
.idcard .info dt{font-family:var(--f-latin);font-size:min(8.5px,2cqw);letter-spacing:.18em;color:var(--dim)}
.idcard .info dd{margin:0;font-weight:700;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idcard .info .name{font-family:var(--f-display);font-weight:800;font-size:min(19px,4.4cqw)}
.idcard .info .num{font-family:var(--f-mono);letter-spacing:.06em;color:var(--gold-hi)}
.idcard .foot{position:absolute;left:4.2%;right:4.2%;bottom:4.5%;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.idcard .runes{flex:1;height:min(16px,3.6cqw);display:flex;gap:2px;align-items:flex-end;opacity:.7}
.idcard .runes i{flex:1;background:var(--gold);opacity:.55}
.idcard .sign{font-family:var(--f-sign);font-size:min(20px,4.6cqw);color:var(--gold-hi);line-height:1;text-align:right}
.idcard .sign small{display:block;font-family:var(--f-body);font-size:min(8.5px,2cqw);color:var(--dim)}
.idcard .dormv{color:var(--dim)}
.idcard .dormv.on{color:var(--gold-hi);animation:dormin 1s ease-out}
@keyframes dormin{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 14px var(--gold)}100%{text-shadow:none}}
.idcard .enr{font-size:min(8.5px,2cqw);color:var(--dim);letter-spacing:.06em;margin-bottom:3px}
.idcard .dormOLD{position:absolute;right:16px;top:44px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;color:#1d1630;background:var(--gold);box-shadow:0 0 0 3px rgba(217,178,95,.25);transform:scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.idcard .dorm.on{transform:scale(1)}
.idcard.example{filter:saturate(.7)}
.idcard .exmark{position:absolute;right:16px;bottom:44px;font-size:10px;color:var(--dim);border:1px solid var(--line-soft);padding:1px 6px;border-radius:2px}
.idcard .stamp{position:absolute;right:3%;top:36%;width:min(96px,21cqw);height:min(96px,21cqw);border-radius:50%;border:3px double rgba(209,75,90,.85);color:rgba(209,75,90,.9);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:min(13px,3cqw);line-height:1.3;transform:rotate(-16deg) scale(2.6);opacity:0;pointer-events:none}
.idcard .stamp.hit{animation:stamp .55s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-16deg) scale(2.6)}70%{opacity:1;transform:rotate(-16deg) scale(.92)}100%{opacity:.85;transform:rotate(-16deg) scale(1)}}
.issue .idcard{animation:issue 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes issue{0%{transform:rotateY(-90deg) translateY(30px);opacity:0}60%{transform:rotateY(12deg)}100%{transform:none;opacity:1}}
.sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(244,223,166,.55) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.issue .sweep{animation:sweep 1.6s .9s ease-in-out}
@keyframes sweep{to{transform:translateX(120%)}}

/* issue scene */
.issue{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:46px}
.speech{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:22px 24px}
.speech .who{font-family:var(--f-display);font-weight:800;color:var(--gold-hi);margin-bottom:6px}
.speech .who small{font-family:var(--f-body);font-weight:400;color:var(--dim);margin-left:8px}
.speech p{margin:.3em 0}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--gold)}
@keyframes blink{50%{opacity:0}}

/* altar */
.altar{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:center;padding-block:24px}
.circle-wrap{position:relative;width:min(620px,100%);aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#circle{width:100%;height:100%;overflow:visible}
.hold{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,rgba(244,223,166,.25),rgba(17,24,52,.85) 70%);cursor:pointer;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(12px,1.7vw,16px);color:var(--gold-hi);line-height:1.35;box-shadow:0 0 40px -10px rgba(217,178,95,.6);transition:box-shadow .3s}
.hold:active,.hold.on{box-shadow:0 0 70px 0 rgba(217,178,95,.85)}
.hold small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.85) 30%,transparent 70%);opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.mana{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.mana i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mana),var(--gold-hi));box-shadow:0 0 12px var(--gold)}
.typeslist{display:flex;flex-wrap:wrap;gap:6px}
.typeslist span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--c)}

/* result */
.result{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;padding-block:30px;align-items:start}
.beast{position:relative;border-radius:10px;overflow:hidden;background:var(--night-2);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);box-shadow:0 0 80px -20px var(--tc),0 30px 60px -30px rgba(0,0,0,.9);animation:reveal 1.3s cubic-bezier(.2,.9,.2,1) both}
@keyframes reveal{0%{transform:perspective(1000px) rotateY(80deg) scale(.7);opacity:0;filter:brightness(4)}60%{filter:brightness(1.6)}100%{transform:none;opacity:1;filter:none}}
.beast .pic{position:relative;aspect-ratio:4/3;overflow:hidden}
.beast .pic img{width:100%;height:100%;object-fit:cover;display:block}
.beast .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--night-2) 2%,transparent 45%)}
.beast .badge{position:absolute;left:14px;top:14px;z-index:2;display:flex;gap:6px}
.beast .badge span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(9,13,31,.75);border:1px solid var(--tc);color:var(--tc)}
.beast .body{padding:0 22px 22px;margin-top:-58px;position:relative;z-index:2}
.beast h2{font-family:var(--f-display);font-weight:800;font-size:40px;margin:0;line-height:1.1;text-shadow:0 0 24px var(--tc)}
.beast .race{color:var(--muted);font-size:14px}
.beast .line{font-family:var(--f-display);font-size:16.5px;margin:14px 0;padding:12px 16px;border-left:2px solid var(--tc);background:rgba(255,255,255,.03)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 28px;font-size:13px;margin:12px 0}
.stat{display:grid;grid-template-columns:2.6em minmax(0,1fr) 3ch;gap:8px;align-items:center}
.stat b{font-weight:400;color:var(--muted)}
.stat s{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.08);text-decoration:none;overflow:hidden}
.stat s i{display:block;height:100%;background:var(--tc);transform-origin:left;animation:grow 1.2s .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.stat span{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.skills{display:grid;gap:8px}
.skill{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line-soft);border-radius:4px;padding:9px 12px;font-size:14px}
.skill .k{font-family:var(--f-mono);font-size:12.5px;color:var(--gold-hi);white-space:nowrap}
.evo{font-size:13px;color:var(--dim);margin-top:12px}
.evo b{color:var(--parch);font-weight:700}
.copybox{background:rgba(8,12,30,.7);border:1px solid var(--line);border-radius:4px;padding:14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;color:var(--parch)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#1d1630;padding:10px 18px;border-radius:3px;font-weight:700;transition:.35s;z-index:30}
.toast.on{transform:translate(-50%,0);opacity:1}
.panel-title{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0 0 6px}


/* ===== v2 upgrade ===== */
:root{--sun:#ffb25a;--moon:#8fa2ff;--star:#7fe0b4}
.hero-logo{width:min(520px,100%)}
.intro-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 0 22px;border-block:1px solid var(--line-soft)}
.intro-facts div{padding:12px 14px;border-left:1px solid var(--line-soft);min-width:0}
.intro-facts div:first-child{border-left:0;padding-left:0}
.intro-facts dt{font-family:var(--f-latin);font-size:10.5px;letter-spacing:.2em;color:var(--gold)}
.intro-facts dd{margin:2px 0 0;font-size:13.5px;color:var(--parch)}
.sec{padding-block:64px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:38em}

        <div class="field full"><label class="l" for="origin">출신 <em>필수</em></label>
          <select id="origin"><option value="">출신 지역을 고르세요</option>${Object.keys(ORIGINS).map(o => `<option ${p.origin === o ? "selected" : ""}>${o}</option>`).join("")}</select>
          <div class="origin-note" id="onote">${p.origin ? ORIGINS[p.origin] : "출신에 따라 동기들의 첫인상이 조금씩 달라집니다."}</div></div>
        <div class="field full"><label class="l" for="look">외형 <em>선택</em></label><input type="text" id="look" maxlength="60" placeholder="예: 짧은 흑발, 회색 눈, 큰 키" value="${esc(p.look)}"></div>
        <div class="field full"><span class="l">성격 <em>최대 3개</em></span><div class="chips" id="traits">${TRAITS.map(t => `<button type="button" class="chip" aria-pressed="${p.traits.includes(t)}">${t}</button>`).join("")}</div></div>
        <div class="field full"><span class="l">소환진에 품을 마음 <em>선택 · 제단이 참고만 합니다</em></span>
          <div class="wishes" id="wishes">${WISHES.map(([t,l]) => `<button type="button" class="wish" data-t="${t}" style="--c:${t ? `var(${TYPES[t]})` : "var(--gold-hi)"}" aria-pressed="${!!p.wishSet && p.wish === t}"><i>${t || "✦"}</i>${l}</button>`).join("")}</div></div>
        <div class="field full"><label class="l" for="intro">자기소개 <em>선택 · 200자</em></label><textarea id="intro" maxlength="200" placeholder="예: 시골 서점집 막내. 책으로만 보던 소환수를 직접 만나고 싶어서 왔다.">${esc(p.intro)}</textarea></div>
        <div class="field full"><span class="l">증명사진 <em>선택</em></span>
          <div class="upload"><label for="photo">사진 올리기</label><input type="file" id="photo" accept="image/*"><span class="hint" id="phint">${p.photo ? "사진이 등록됐어요." : "없으면 이름 첫 글자가 들어갑니다."}</span></div></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="row" style="justify-content:space-between;margin-top:6px"><button type="button" class="ghost" id="back">처음으로</button><button class="cta" type="button" id="submitReg">학생증 발급 신청</button></div>
    </form>
    <aside class="side"><div class="cap">LIVE PREVIEW · 학생증</div><div class="card-stage" id="cs">${cardHTML(true)}</div>
      <p class="hint" style="text-align:center">학번과 기숙사는 발급과 소환 뒤에 채워집니다.</p></aside>
  </section>`;
  const upd = () => { $("#cs").innerHTML = cardHTML(!p.name); tilt($("#idcard")); };
  tilt($("#idcard"));
  ["name","age","look","intro"].forEach(k => $("#" + k).addEventListener("input", e => { p[k] = e.target.value; upd(); }));
  $("#origin").onchange = e => { p.origin = e.target.value; $("#onote").textContent = ORIGINS[p.origin] || ""; upd(); };
  $("#gender").onclick = e => { const b = e.target.closest("button"); if (!b) return; p.gender = b.dataset.v; [...$("#gender").children].forEach(x => x.setAttribute("aria-pressed", x === b)); tone(660, .25); upd(); };
  $("#traits").onclick = e => { const b = e.target.closest("button"); if (!b) return; const t = b.textContent; const on = p.traits.includes(t);
    if (!on && p.traits.length >= 3) { toast("성격은 3개까지 고를 수 있어요"); return; }
    p.traits = on ? p.traits.filter(x => x !== t) : [...p.traits, t]; b.setAttribute("aria-pressed", !on); tone(on ? 440 : 740, .2); };
  $("#wishes").onclick = e => { const b = e.target.closest("button"); if (!b) return; p.wish = b.dataset.t; p.wishSet = true; [...$("#wishes").children].forEach(x => x.setAttribute("aria-pressed", x === b)); tone(880, .3, "triangle"); };
  $("#photo").onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement("canvas"), s = 300 / img.width; c.width = 300; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); p.photo = c.toDataURL("image/jpeg", .82); $("#phint").textContent = "사진이 등록됐어요."; upd(); }; img.src = rd.result; };
    rd.readAsDataURL(f); };
  $("#back").onclick = hero;
  const submitReg = () => {
    ["name","age","look","intro"].forEach(k => { p[k] = $("#" + k).value; });
    p.origin = $("#origin").value;
    const a = parseInt(p.age, 10);
    const msg = !p.name.trim() ? "성명을 적어 주세요." : !(a >= 19 && a <= 99) ? "나이는 19세부터 입력할 수 있어요." : !p.gender ? "성별을 골라 주세요." : !p.origin ? "출신 지역을 골라 주세요." : "";
    $("#err").textContent = msg; if (msg) { tone(200, .3, "square", .04); toast(msg); $("#err").scrollIntoView({block:"center",behavior:"smooth"}); return; }
    S.id = "E301-" + String(Math.floor(1000 + Math.random() * 9000));
    try { issue(); } catch (err) { console.error(err); toast("발급 중 문제가 생겼어요. 다시 눌러 주세요."); } };
  $("#submitReg").addEventListener("click", submitReg);
  $("#f").addEventListener("submit", e => { e.preventDefault(); submitReg(); });
}

function issue(){
  setStep(2);
  app.innerHTML = `<section class="scene issue">
    <div class="card-stage">${cardHTML(false)}</div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="speech"><div class="who">마가렛 하인즈 교수<small>배틀 실습 · 기숙사 총감</small></div><p id="say" class="typing"></p></div>
      <div class="row"><button class="cta" id="next" type="button" disabled>소환의 제단으로</button></div>
    </div>
  </section>`;
  tilt($("#idcard"));
  tone(330, 1.2, "triangle", .05); setTimeout(chime, 900);
  setTimeout(() => { $("#stamp").classList.add("hit"); tone(90, .4, "square", .08); }, 1700);
  const line = `${S.p.name} 학생. 학번 ${S.id}, 등록을 확인했습니다. 잃어버리면 재발급에 벌점 1점입니다. 다음은 소환의 제단입니다. 마나는 일정하게 흘려 넣으십시오. 망설임은 소환수에게 그대로 전해집니다.`;
  let i = 0; const say = $("#say");
  const iv = setInterval(() => { say.textContent = line.slice(0, ++i); if (i % 3 === 0) tone(1200 + Math.random() * 200, .04, "sine", .015); if (i >= line.length) { clearInterval(iv); say.classList.remove("typing"); $("#next").disabled = false; } }, reduce ? 1 : 32);
  $("#next").onclick = altar;
}

function pick(){
  const g = S.p.gender, female = BEASTS.filter(b => b.g === "f"), male = BEASTS.filter(b => b.g === "m");
  const w = BEASTS.map(b => {
    let v = 1;
    if (g === "m") v = b.g === "f" ? 80 / female.length : 20 / male.length;
    else if (g === "f") v = b.g === "m" ? 70 / male.length : 30 / female.length;
    if (S.p.wish && b.t === S.p.wish) v *= 1.5;
    return v; });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < BEASTS.length; i++) { r -= w[i]; if (r <= 0) return BEASTS[i]; }
  return BEASTS[BEASTS.length - 1];
}

function altar(){
  setStep(3);
  const order = ["화","수","풍","지","빛","어둠","무"];
  app.innerHTML = `<section class="scene altar">
    <div class="circle-wrap" id="cw">
      <svg id="circle" viewBox="-300 -300 600 600" aria-hidden="true"></svg>
      <button class="hold" id="hold" type="button" aria-describedby="howto">길게 눌러<br>마나를 흘려 넣기<small>스페이스바도 됩니다</small></button>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="speech"><div class="who">소환의 제단<small>칠류가 모이는 섬의 중심</small></div>
        <p id="howto">소환진 중앙을 누른 채로 마나를 흘려 넣으세요. 손을 떼면 마나가 흩어집니다. 일곱 흐름이 모두 깨어나면 소환이 시작됩니다.</p></div>
      <div><div class="l" style="font-size:13px;color:var(--gold-hi);margin-bottom:6px">마나 공명도</div><div class="mana"><i id="mana"></i></div></div>
      <div class="typeslist">${order.map(t => `<span style="--c:var(${TYPES[t]})">${t}</span>`).join("")}</div>
      <p class="hint">입학 소환은 일반 등급만 응답합니다. 결과는 바꿀 수 없어요.</p>
    </div>
  </section>`;
  // build circle
  const svg = $("#circle"), NS = "http://www.w3.org/2000/svg";
  const el = (n, a, p = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const defs = el("defs", {});
  const rg = el("radialGradient", { id: "core" }, defs); el("stop", { offset: "0", "stop-color": "#f4dfa6", "stop-opacity": ".55" }, rg); el("stop", { offset: "1", "stop-color": "#f4dfa6", "stop-opacity": "0" }, rg);
  el("path", { id: "rp", d: "M0,-236 a236,236 0 1,1 -0.1,0", fill: "none" }, defs);
  el("path", { id: "rp2", d: "M0,-158 a158,158 0 1,0 0.1,0", fill: "none" }, defs);
  const glow = el("circle", { r: 290, fill: "url(#core)", opacity: .25 });
  const gA = el("g", {}), gB = el("g", {}), gC = el("g", {});
  el("circle", { r: 262, fill: "none", stroke: "#d9b25f", "stroke-width": 2, opacity: .8 }, gA);
  el("circle", { r: 250, fill: "none", stroke: "#d9b25f", "stroke-width": .8, opacity: .5 }, gA);
  const tx = el("text", { fill: "#d9b25f", "font-size": 15, "letter-spacing": 6, "font-family": "Cinzel, serif", opacity: .85 }, gA);
  const tp = el("textPath", { href: "#rp", startOffset: "0" }, tx); tp.textContent = "✦ CONTRACTUS NON DOMINATIO SED RESONANTIA ✦ ETERNA ✦ SEPTEM FLUMINA ✦ CONTRACTUS NON DOMINATIO SED RESONANTIA ✦";
  el("circle", { r: 218, fill: "none", stroke: "#8fa2ff", "stroke-width": 1.2, "stroke-dasharray": "2 9", opacity: .7 }, gB);
  const ring = el("circle", { r: 200, fill: "none", stroke: "#f4dfa6", "stroke-width": 4, "stroke-dasharray": `${2 * Math.PI * 200}`, "stroke-dashoffset": `${2 * Math.PI * 200}`, transform: "rotate(-90)", "stroke-linecap": "round" });
  const pts = n => Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [Math.cos(a) * 180, Math.sin(a) * 180]; });
  const P7 = pts(7);
  el("polygon", { points: P7.map((p, i) => P7[(i * 3) % 7].join(",")).join(" "), fill: "none", stroke: "#d9b25f", "stroke-width": 1.2, opacity: .7 }, gC);
  el("polygon", { points: P7.map((p, i) => P7[(i * 2) % 7].join(",")).join(" "), fill: "none", stroke: "#8fa2ff", "stroke-width": .9, opacity: .55 }, gC);
  el("circle", { r: 150, fill: "none", stroke: "#d9b25f", "stroke-width": 1, opacity: .6 }, gC);
  const tx2 = el("text", { fill: "#a3abcc", "font-size": 12, "letter-spacing": 4, "font-family": "Noto Sans KR, sans-serif", opacity: .7 }, gC);
  const tp2 = el("textPath", { href: "#rp2" }, tx2); tp2.textContent = "화 · 수 · 풍 · 지 · 빛 · 어둠 · 무 · 일곱 흐름이 하나로 모인다 · 화 · 수 · 풍 · 지 · 빛 · 어둠 · 무 ·";
  const nodes = order.map((t, i) => { const [x, y] = P7[i].map(v => v * 1.33); const g = el("g", { transform: `translate(${x},${y})` });
    const c = el("circle", { r: 24, fill: "#0d132d", stroke: tcol(t), "stroke-width": 1.6, opacity: .55 }, g);
    const h = el("circle", { r: 24, fill: tcol(t), opacity: 0 }, g);
    const tt = el("text", { "text-anchor": "middle", dy: "5", fill: tcol(t), "font-size": t.length > 1 ? 12 : 15, "font-family": "Noto Sans KR, sans-serif", "font-weight": 800 }, g); tt.textContent = t;
    return { t, c, h, tt, g, x, y }; });
  const beam = el("g", {});
  // animation
  let p = 0, holding = false, spin = 0, last = performance.now(), done = false, raf;
  const L = 2 * Math.PI * 200;
  function loop(now){
    const dt = Math.min(now - last, 50); last = now;
    p = holding ? Math.min(1, p + dt / 2800) : Math.max(0, p - dt / 1600);
    spin += dt * (0.006 + p * 0.09);
    gA.setAttribute("transform", `rotate(${spin * .4})`); gB.setAttribute("transform", `rotate(${-spin * .7})`); gC.setAttribute("transform", `rotate(${spin * .25}) scale(${1 + p * .04})`);
    ring.setAttribute("stroke-dashoffset", L * (1 - p)); glow.setAttribute("opacity", .2 + p * .7);
    nodes.forEach((n, i) => { const on = p > (i + 1) / 8; n.c.setAttribute("opacity", on ? 1 : .5); n.h.setAttribute("opacity", on ? .28 + .12 * Math.sin(now / 120 + i) : 0); });
    $("#mana").style.width = p * 100 + "%";
    humSet(p);
    if (holding && !reduce && Math.random() < p * .6) { const r = $("#cw").getBoundingClientRect(); const a = Math.random() * 7, R = r.width * .48;
      const n = nodes[Math.floor(Math.random() * 7)]; burst.push({ x: (r.left + r.width / 2 + Math.cos(a) * R) * Math.min(devicePixelRatio || 1, 2), y: (r.top + r.height / 2 + Math.sin(a) * R) * Math.min(devicePixelRatio || 1, 2), vx: -Math.cos(a) * 4, vy: -Math.sin(a) * 4, r: 1.6, l: 60, c: tcol(n.t) }); }
    if (p >= 1 && !done) { done = true; summon(); return; }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  const hold = $("#hold");
  const down = e => { if (done) return; if (e.cancelable) e.preventDefault(); holding = true; hold.classList.add("on"); humStart(); };
  const up = () => { holding = false; hold.classList.remove("on"); humStop(); };
  hold.addEventListener("pointerdown", down); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  hold.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !e.repeat) down(e); });
  hold.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") up(); });
  hold.focus({ preventScroll: true });

  function summon(){
    holding = false; humStop();
    const b = pick(); S.beast = b; S.dorm = DORM[b.t];
    const n = nodes.find(x => x.t === b.t), col = tcol(b.t);
    n.h.setAttribute("opacity", .9);
    for (let i = 0; i < 26; i++) el("line", { x1: 0, y1: 0, x2: Math.cos(i / 26 * 7) * 900, y2: Math.sin(i / 26 * 7) * 900, stroke: i % 2 ? col : "#fff4d0", "stroke-width": 3, opacity: .0 }, beam).animate([{ opacity: 0 }, { opacity: .9 }, { opacity: 0 }], { duration: 1100, delay: i * 18, easing: "ease-out" });
    hold.innerHTML = `<span style="color:${col}">${b.t}</span>`;
    tone(196, 1.5, "sawtooth", .05); tone(294, 1.5, "triangle", .05, .1);
    tint = col;
    setTimeout(() => { const r = $("#cw").getBoundingClientRect(); $("#flash").classList.add("go"); explode(r.left + r.width / 2, r.top + r.height / 2, col, 220); chime(); }, 900);
    setTimeout(() => { cancelAnimationFrame(raf); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); $("#flash").classList.remove("go");
      store.set({ p: S.p, id: S.id, beast: S.beast, dorm: S.dorm }); result(); }, 1700);
  }
}

function block(){
  const p = S.p, b = S.beast, st = stats(b);
  const g = { m: "남성", f: "여성", x: "밝히지 않음" }[p.gender];
  return `[에테르나 소환 아카데미 | 입학 등록 결과]
이름: ${p.name}
나이: ${p.age}
성별: ${g}
출신: ${p.origin}
외형: ${p.look || "-"}
성격: ${p.traits.join(", ") || "-"}
자기소개: ${p.intro || "-"}
학번: ${S.id} · 입학 협약력 301년 봄
기숙사: ${S.dorm}의 동
파트너: ${b.n} (${b.t}·일반·${b.race}${b.g === "f" ? "♀" : "♂"}·${b.role}) Lv 5 · XP 0/20
스탯: HP ${st.HP}/${st.HP} · 공 ${st.공격} · 방 ${st.방어} · 특공 ${st.특공} · 특방 ${st.특방} · 속 ${st.속도}
고유기: ${b.sk.map(s => `${s[0]}(${s[1]}|${s[2]}/${s[2]})${s[3] ? " " + s[3] : ""}`).join(" / ")}
첫 대사: "${b.line}"`;
}

function result(fromSave){
  setStep(4);
  const b = S.beast, col = tcol(b.t), st = stats(b), max = 180;
  tint = col;
  app.innerHTML = `<section class="scene result" style="--tc:${col}">
    <article class="beast">
      <div class="pic"><img src="img/${b.id}.webp" alt="${b.n} 기본체"></div>
      <div class="badge"><span>${b.t} 속성</span><span>일반</span><span>Lv 5</span></div>
      <div class="body">
        <h2>${b.n}</h2>
        <div class="race">${b.race} ${b.g === "f" ? "♀" : "♂"} · ${b.role} · 기본체</div>
        <p class="line">“${esc(b.line)}”</p>
        <p style="margin:0 0 6px">${b.trait}</p>
        <p class="hint" style="margin:0">성격: ${b.per}</p>
        <div class="statwrap">${radar(st, col)}<div class="stats">${Object.entries(st).map(([k, v]) => `<div class="stat"><b>${k}</b><s><i style="transform:scaleX(${Math.min(v / max, 1)})"></i></s><span>${v}</span></div>`).join("")}</div></div>
        <div class="skills">${b.sk.map(s => `<div class="skill"><span><b>${s[0]}</b> <span class="hint">${s[3]}</span></span><span class="k">${s[1]} | ${s[2]}/${s[2]}</span></div>`).join("")}</div>
        <p class="evo">진화 계열: <b>${b.n}</b> → <b>???</b> (Lv 16) → <b>???</b> (Lv 36)</p>
      </div>
    </article>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="card-stage">${cardHTML(false)}</div>
      <div class="dormcard" style="--c:${DORM_C[S.dorm]}"><i>${S.dorm}</i><div><b>${S.dorm}의 동 배정</b><span>${b.n}의 ${b.t} 속성 · 이번 달 기숙사 점수 순위는 입학 후 발표됩니다.</span></div></div>
      <div class="dexmap"><h4>도감 <em>1 / 80</em></h4><p>${b.n}(기본체)가 첫 칸을 열었습니다.</p><div class="cells">${Array.from({ length: 80 }, (_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="sheet" style="padding:20px">
        <h3 class="panel-title">채팅 제출용 결과</h3>
        <p class="hint" style="margin:0 0 10px">복사해서 채팅 첫 메시지로 그대로 붙여넣으세요.</p>
        <pre class="copybox" id="cb" tabindex="0">${esc(block())}</pre>
        <div class="row" style="margin-top:12px;justify-content:space-between"><button class="ghost" id="again" type="button">처음부터 다시 등록</button><button class="cta" id="copy" type="button">결과 복사하기</button></div>
      </div>
    </div>
  </section>`;
  tilt($("#idcard"));
  if (!fromSave) setTimeout(() => tone(660, .5, "triangle"), 700);
  $("#copy").onclick = () => { const t = block();
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("#cb")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("텍스트를 선택했어요. 복사해서 붙여넣으세요"); };
    try { navigator.clipboard.writeText(t).then(() => { toast("복사했어요. 채팅에 붙여넣으세요"); chime(); }, sel); } catch(e) { sel(); } };
  $("#again").onclick = () => { S.p = { name:"", age:"", gender:"", origin:"", look:"", traits:[], wish:"", intro:"", photo:"" }; S.id = ""; S.beast = null; S.dorm = ""; tint = null; register(); };
}

hero();
})();
</script>
